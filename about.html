<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나를 소개한다.</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Orbit&amp;family=Noto+Sans+KR:wght@400;700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Global Styles & Cyberpunk Neon Theme */
    :root {
      --bg-color: #080711;
      --card-bg: rgba(20, 15, 38, 0.75);
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff007f;
      --neon-purple: #9d00ff;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --text-color: #f0f3fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%),
        linear-gradient(to bottom, #05040a, #0b0817);
      padding-bottom: 60px;
    }

    /* Grid Background Pattern Effect */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    /* Sparkle Particle Canvas */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Main Container */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      box-shadow: 0 0 30px var(--neon-yellow);
    }

    /* Bounce Text Animation */
    @keyframes bounceChar {
      0%, 100% {
        transform: translateY(0);
        text-shadow: 0 0 5px currentColor, 0 0 10px currentColor, 0 0 20px currentColor;
      }
      50% {
        transform: translateY(-16px) scale(1.1);
        text-shadow: 0 0 15px currentColor, 0 0 30px currentColor, 0 0 45px currentColor, 0 0 60px #fff;
      }
    }

    /* Sparkling Neon Color Pulsing Effects */
    @keyframes sparkleGlow {
      0%, 100% {
        filter: brightness(1) drop-shadow(0 0 3px rgba(255,255,255,0.6));
      }
      50% {
        filter: brightness(1.7) drop-shadow(0 0 15px currentColor);
      }
    }

    .bounce-text span {
      display: inline-block;
      animation: bounceChar 1.2s infinite ease-in-out, sparkleGlow 1.8s infinite ease-in-out alternate;
    }

    /* Staggered delay for each letter */
    .bounce-text span:nth-child(1) { animation-delay: 0.0s; }
    .bounce-text span:nth-child(2) { animation-delay: 0.1s; }
    .bounce-text span:nth-child(3) { animation-delay: 0.2s; }
    .bounce-text span:nth-child(4) { animation-delay: 0.3s; }
    .bounce-text span:nth-child(5) { animation-delay: 0.4s; }
    .bounce-text span:nth-child(6) { animation-delay: 0.5s; }
    .bounce-text span:nth-child(7) { animation-delay: 0.6s; }
    .bounce-text span:nth-child(8) { animation-delay: 0.7s; }
    .bounce-text span:nth-child(9) { animation-delay: 0.8s; }
    .bounce-text span:nth-child(10) { animation-delay: 0.9s; }
    .bounce-text span:nth-child(11) { animation-delay: 1.0s; }
    .bounce-text span:nth-child(12) { animation-delay: 1.1s; }

    /* Header Section */
    header {
      text-align: center;
      padding: 40px 10px 30px;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--neon-cyan);
      background: rgba(0, 243, 255, 0.1);
      color: var(--neon-cyan);
      font-size: 0.9rem;
      font-family: 'Orbit', sans-serif;
      letter-spacing: 2px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    h1.main-title {
      font-size: 3.2rem;
      font-family: 'Orbit', sans-serif;
      letter-spacing: 2px;
      margin-bottom: 15px;
      word-break: keep-all;
    }

    p.subtitle {
      color: #b8c1ec;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* Section Styling */
    section {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px 20px;
      margin-bottom: 35px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    section::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,0,127,0.4), transparent 50%, rgba(0,243,255,0.4));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .section-title {
      font-size: 1.6rem;
      font-family: 'Orbit', sans-serif;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title i {
      color: var(--neon-cyan);
    }

    /* 3D Flip Card Component */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      perspective: 1000px;
    }

    .flip-card {
      background-color: transparent;
      height: 280px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .flip-card-front {
      background: linear-gradient(145deg, rgba(25, 20, 50, 0.9), rgba(12, 10, 28, 0.9));
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .flip-card-front i {
      font-size: 3.8rem;
      margin-bottom: 18px;
      transition: transform 0.3s ease;
    }

    .flip-card:hover .flip-card-front i {
      transform: scale(1.15) rotate(5deg);
    }

    .flip-card-front h3 {
      font-size: 1.4rem;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .click-hint {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .flip-card-back {
      background: linear-gradient(145deg, rgba(40, 15, 60, 0.95), rgba(15, 8, 30, 0.95));
      transform: rotateY(180deg);
      border-color: var(--neon-magenta);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .flip-card-back h4 {
      font-size: 1.2rem;
      color: var(--neon-yellow);
      margin-bottom: 12px;
    }

    .flip-card-back p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e0e5ff;
      word-break: keep-all;
    }

    /* Common Buttons */
    .neon-btn {
      background: transparent;
      border: 2px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 12px 26px;
      font-size: 1rem;
      font-weight: bold;
      font-family: 'Orbit', sans-serif;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .neon-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 25px var(--neon-cyan);
      transform: translateY(-2px);
    }

    .neon-btn:active {
      transform: translateY(1px);
    }

    /* OX Quiz Section */
    .quiz-container {
      text-align: center;
      padding: 10px 0;
    }

    .quiz-question {
      font-size: 1.3rem;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }

    .quiz-btn-group {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .ox-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      font-size: 2.5rem;
      font-weight: 900;
      font-family: 'Orbit', sans-serif;
      border: 3px solid;
      background: rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .ox-btn-o {
      border-color: var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }

    .ox-btn-o:hover {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 30px var(--neon-green);
      transform: scale(1.1);
    }

    .ox-btn-x {
      border-color: var(--neon-magenta);
      color: var(--neon-magenta);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
    }

    .ox-btn-x:hover {
      background: var(--neon-magenta);
      color: #fff;
      box-shadow: 0 0 30px var(--neon-magenta);
      transform: scale(1.1);
    }

    .quiz-result {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    /* Game Recommendation Section */
    .recommend-box {
      text-align: center;
      padding: 10px 0;
    }

    .game-display {
      margin: 20px auto;
      padding: 25px;
      min-height: 120px;
      background: rgba(10, 8, 22, 0.8);
      border: 2px solid var(--neon-purple);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(157, 0, 255, 0.2);
      transition: all 0.3s ease;
    }

    .game-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--neon-yellow);
      margin-bottom: 8px;
    }

    .game-desc {
      font-size: 0.95rem;
      color: #a0aabf;
    }

    /* 10-Second Click Mini-Game */
    .minigame-box {
      text-align: center;
    }

    .game-stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 12px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #8892b0;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 2rem;
      font-family: 'Orbit', sans-serif;
      font-weight: bold;
      color: var(--neon-cyan);
    }

    .click-target-btn {
      width: 100%;
      max-width: 300px;
      height: 100px;
      margin: 10px auto;
      font-size: 1.3rem;
      border-radius: 20px;
      border: 3px solid var(--neon-magenta);
      background: rgba(255, 0, 127, 0.1);
      color: #fff;
      font-family: 'Orbit', sans-serif;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .click-target-btn:active {
      transform: scale(0.96);
      background: rgba(255, 0, 127, 0.3);
    }

    .click-target-btn:disabled {
      border-color: #4a4a6a;
      color: #6c6c8a;
      box-shadow: none;
      cursor: not-allowed;
      background: rgba(20, 20, 35, 0.5);
    }

    .record-msg {
      margin-top: 15px;
      font-size: 1.1rem;
      color: var(--neon-green);
      font-weight: bold;
      min-height: 30px;
    }

    /* Footer */
    footer {
      text-align: center;
      color: #5a6282;
      font-size: 0.85rem;
      margin-top: 20px;
    }

    /* Responsive Mobile Adjustments */
    @media (max-width: 600px) {
      h1.main-title {
        font-size: 2.3rem;
      }

      .section-title {
        font-size: 1.3rem;
      }

      .ox-btn {
        width: 75px;
        height: 75px;
        font-size: 2rem;
      }

      .flip-card {
        height: 250px;
      }

      .stat-value {
        font-size: 1.6rem;
      }
    }
  </style>

@media(max-width:600px){.st-nav-tab{position:fixed;top:auto;bottom:0;left:0;border-bottom:0;border-top:1px solid rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom)}.st-nav-tab .st-nav-in{flex-wrap:nowrap;justify-content:space-around;gap:0;padding:4px}.st-nav-tab .st-nav-a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-nav-tab .st-nav-a.is-on{background:none;color:var(--st-accent)}.st-nav-tab .st-nav-i{margin:0;font-size:22px;line-height:1.1}}
.st-g-point{--st-g:linear-gradient(135deg,rgba(255,255,255,0),rgba(255,255,255,.45)),linear-gradient(var(--st-accent),var(--st-accent));--st-gi:#fff}.st-g-sunset{--st-g:linear-gradient(135deg,#f43f5e,#f97316);--st-gi:#fff}.st-g-ocean{--st-g:linear-gradient(135deg,#2563eb,#06b6d4);--st-gi:#fff}.st-g-grape{--st-g:linear-gradient(135deg,#7c3aed,#ec4899);--st-gi:#fff}.st-g-forest{--st-g:linear-gradient(135deg,#047857,#34d399);--st-gi:#fff}.st-g-night{--st-g:linear-gradient(135deg,#0f172a,#475569);--st-gi:#fff}.st-g-peach{--st-g:linear-gradient(135deg,#ffe4e6,#fef3c7);--st-gi:#222}.st-g-mint{--st-g:linear-gradient(135deg,#d1fae5,#dbeafe);--st-gi:#222}.st-g-lav{--st-g:linear-gradient(135deg,#ede9fe,#fce7f3);--st-gi:#222}
html body [class*="st-g-"]{background-image:var(--st-g);color:var(--st-gi)}
html body .st-gtx{color:transparent;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.st-hv-lift,.st-hv-grow,.st-hv-glow,.st-hv-press{transition:translate .2s,scale .2s,box-shadow .2s}
@media(hover:hover){.st-hv-lift:hover{translate:0 -6px;box-shadow:0 14px 28px rgba(0,0,0,.18)}.st-hv-grow:hover{scale:1.04}.st-hv-glow:hover{box-shadow:0 8px 24px rgba(0,0,0,.25);box-shadow:0 0 0 3px color-mix(in srgb,var(--st-accent) 35%,transparent),0 8px 24px color-mix(in srgb,var(--st-accent) 45%,transparent)}}
.st-hv-press:active{scale:.95}
html.st-js [data-st-in]{opacity:0;transition:opacity .6s ease,transform .6s ease,translate .2s,scale .2s,box-shadow .2s}
html.st-js [data-st-in="up"]{transform:translateY(26px)}html.st-js [data-st-in="zoom"]{transform:scale(.9)}html.st-js [data-st-in="left"]{transform:translateX(-30px)}
html.st-js [data-st-in].is-in{opacity:1;transform:none}
html.st-editing [data-st-in]{opacity:1!important;transform:none!important}
.st-editing .st-swipe{flex-wrap:wrap;overflow:visible}
html.st-dark{filter:invert(1) hue-rotate(180deg);background:#fff}
html.st-dark img,html.st-dark video,html.st-dark iframe,html.st-dark canvas{filter:invert(1) hue-rotate(180deg)}
.st-editing .st-tab-panel{display:block!important;outline:2px dashed rgba(0,0,0,.18);outline-offset:4px;margin:12px 0}
.st-editing .st-slides{flex-wrap:wrap;gap:10px;overflow:visible}
.st-editing .st-prev,.st-editing .st-next{display:none}
.st-editing dialog.st-modal{display:block;position:static;margin:12px auto;outline:2px dashed rgba(0,0,0,.25)}
.st-editing .st-embed iframe{pointer-events:none}
</style></head>
<body>
<nav class="st-nav" data-studio="nav">
  <div class="st-nav-in">
    <a class="st-nav-a" href="index.html">홈</a>
    <a class="st-nav-a is-on" href="about.html">월즈</a>
  </div>
</nav>

<div class="container">
  <h1 class="main-title bounce-text">월즈</h1>
  <p class="subtitle">이 페이지에 들어갈 내용을 왼쪽 블록 넣기로 채워 보세요.</p>
</div>
<div class="st-sec st-embed" data-kind="youtube">
<iframe src="https://www.youtube.com/embed/qhldObL8zpY" title="유튜브 동영상" loading="lazy" allowfullscreen=""></iframe>
</div>
<div class="st-sec st-quiz" data-st="quiz" data-ok-msg="정답이에요! 🎉" data-no-msg="아쉬워요. 다시 골라 봐요.">
  <p class="st-q">어느 팀이 우승했을까?</p>
  <div class="st-opts">
    <button class="st-opt" type="button">GEN</button><button class="st-opt" type="button" data-ok="">BLG</button>
    
    
  </div>
  <p class="st-qr" aria-live="polite"></p>
</div>


<script data-studio="js">
(function () {
    function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
    each('[data-st="tabs"]', function (t) {
      var bs = t.querySelectorAll('.st-tab'), ps = t.querySelectorAll('.st-tab-panel');
      function show(i) { bs.forEach(function (b, k) { b.classList.toggle('is-on', k === i); b.setAttribute('aria-selected', k === i); }); ps.forEach(function (p, k) { p.hidden = k !== i; }); }
      bs.forEach(function (b, i) { b.addEventListener('click', function () { show(i); }); });
      show(0);
    });
    each('[data-st-open]', function (b) { b.addEventListener('click', function () { var d = document.getElementById(b.getAttribute('data-st-open')); if (d && d.showModal) d.showModal(); }); });
    each('dialog.st-modal', function (d) { d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-st-close]')) d.close(); }); });
    each('[data-st="slider"]', function (s) {
      var tr = s.querySelector('.st-slides'), dots = s.querySelector('.st-dots'), i = 0, n = tr.children.length;
      function paint() { if (dots) Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('is-on', k === i); }); }
      function go(k) { i = (k + n) % n; tr.scrollTo({ left: tr.clientWidth * i, behavior: 'smooth' }); paint(); }
      if (dots) { dots.innerHTML = ''; for (var k = 0; k < n; k++) (function (k) { var d = document.createElement('button'); d.type = 'button'; d.setAttribute('aria-label', (k + 1) + '번째 사진'); d.addEventListener('click', function () { go(k); }); dots.appendChild(d); })(k); }
      var pv = s.querySelector('.st-prev'), nx = s.querySelector('.st-next');
      if (pv) pv.addEventListener('click', function () { go(i - 1); });
      if (nx) nx.addEventListener('click', function () { go(i + 1); });
      tr.addEventListener('scroll', function () { var k = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); if (k !== i) { i = k; paint(); } });
      paint();
    });
    each('[data-st="quiz"]', function (q) {
      var r = q.querySelector('.st-qr'), os = q.querySelectorAll('.st-opt');
      os.forEach(function (o) { o.addEventListener('click', function () { var ok = o.hasAttribute('data-ok'); os.forEach(function (x) { x.classList.remove('is-ok', 'is-no'); }); o.classList.add(ok ? 'is-ok' : 'is-no'); if (r) r.textContent = ok ? (q.getAttribute('data-ok-msg') || '정답이에요!') : (q.getAttribute('data-no-msg') || '다시 생각해 봐요.'); }); });
    });
    each('[data-st="check"]', function (c, ci) {
      var bs = c.querySelectorAll('input[type=checkbox]'), out = c.querySelector('.st-cnt'), bar = c.querySelector('.st-bar i'), key = 'st-check-' + location.pathname + '-' + ci, sv = {};
      try { sv = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) {}
      function up() { var d = 0; bs.forEach(function (b) { if (b.checked) d++; }); if (out) out.textContent = d + ' / ' + bs.length + ' 완료'; if (bar) bar.style.width = (bs.length ? d / bs.length * 100 : 0) + '%'; }
      bs.forEach(function (b, i) { b.checked = !!sv[i]; b.addEventListener('change', function () { sv[i] = b.checked; try { localStorage.setItem(key, JSON.stringify(sv)); } catch (e) {} up(); }); });
      up();
    });
    each('[data-st="dday"]', function (e) {
      var o = e.querySelector('.st-dnum'), t = new Date(e.getAttribute('data-date') + 'T00:00:00'), now = new Date(); now.setHours(0, 0, 0, 0);
      var d = Math.round((t - now) / 864e5); if (o) o.textContent = isNaN(d) ? '날짜를 정해요' : d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);
    });
    each('[data-st="timer"]', function (e) {
      var m = +e.getAttribute('data-min') || 25, left = m * 60, id = 0, o = e.querySelector('.st-tnum'), go = e.querySelector('.st-tgo'), rs = e.querySelector('.st-trs');
      function p() { o.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); }
      function stop() { clearInterval(id); id = 0; go.textContent = '시작'; }
      go.addEventListener('click', function () { if (id) { stop(); return; } o.classList.remove('is-done'); id = setInterval(function () { if (left > 0) { left--; p(); } if (left <= 0) { stop(); o.classList.add('is-done'); } }, 1000); go.textContent = '잠시 멈춤'; });
      rs.addEventListener('click', function () { stop(); left = m * 60; o.classList.remove('is-done'); p(); });
      p();
    });
    each('[data-st="dark"]', function (b) {
      try { if (localStorage.getItem('st-dark') === '1') document.documentElement.classList.add('st-dark'); } catch (e) {}
      b.addEventListener('click', function () { var on = document.documentElement.classList.toggle('st-dark'); try { localStorage.setItem('st-dark', on ? '1' : '0'); } catch (e) {} });
    });
    // 스크롤 등장 효과: 화면에 들어오면 나타남 (지원하지 않는 브라우저·움직임 줄이기 설정에서는 그냥 보임)
    var ins = document.querySelectorAll('[data-st-in]');
    if (ins.length && 'IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      document.documentElement.classList.add('st-js');
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { threshold: 0.08 });
      Array.prototype.forEach.call(ins, function (e) { io.observe(e); });
    }
  })();
</script>
